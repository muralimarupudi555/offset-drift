[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offset-drift"
version = "0.1.0"
description = "OFFSET pagination silently skips rows when the table changes under it"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psycopg[binary,pool]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
offset-drift = "offset_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: runs a full delivery sweep, tens of seconds"]
